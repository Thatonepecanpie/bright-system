<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6fde">
  <meta name="build" content="dev">
  <title>Company Floor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Company Floor">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fde'/%3E%3Crect x='6' y='8' width='6' height='16' rx='2' fill='white'/%3E%3Crect x='13' y='8' width='6' height='11' rx='2' fill='white'/%3E%3Crect x='20' y='8' width='6' height='7' rx='2' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <section id="login" class="login panel hidden">
    <h1>Company Floor</h1>
    <p class="muted">Fernando's control room. Enter your owner token to continue. It stays on this device only.</p>
    <label for="token">Owner token</label>
    <input id="token" type="password" autocomplete="current-password" placeholder="own_...">
    <div class="actions"><button class="btn primary" id="login-btn">Open the board</button></div>
    <p id="login-error" class="error hidden"></p>
  </section>

  <div id="app" class="hidden">
    <header class="topbar">
      <span class="brand">Company Floor</span>
      <select id="project-filter" aria-label="Project filter" style="width:auto"></select>
      <span class="spacer"></span>
      <span id="needs-me" class="small"></span>
      <span id="synced" class="small muted"></span>
      <button class="btn small" id="refresh">Refresh</button>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="floor">Floor</button>
      <button class="tab" data-view="board">Board</button>
      <button class="tab" data-view="files">Files</button>
      <button class="tab" data-view="vault">Vault</button>
      <button class="tab" data-view="wins">Wins</button>
      <button class="tab" data-view="projects">Projects &amp; teams</button>
      <button class="tab" data-view="memory">Memory</button>
      <button class="tab" data-view="messages">Messages</button>
      <button class="tab" data-view="activity">Activity</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
    <main>
      <div id="flash"></div>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="dialog">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button class="btn small" id="dialog-close">Close</button></div>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>

  <dialog id="ask" class="ask">
    <div class="dialog-body"><p id="ask-text"></p>
      <div class="actions"><button class="btn primary" id="ask-yes">Confirm</button><button class="btn" id="ask-no">Cancel</button></div></div>
  </dialog>

  <script src="config.js"></script>
  <script src="confetti.js"></script>
  <script src="office.js"></script>
  <script src="sprite-maker.js"></script>
  <script src="app.js"></script>
</body>
</html>
