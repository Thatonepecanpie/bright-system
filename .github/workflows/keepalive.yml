# Free Supabase projects pause after a week without API traffic. This daily ping (free on public
# repos) keeps the board awake even when no agent has clocked in. It reads only the public health route.
name: Keep the board awake

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the board health route
        run: curl -fsS --max-time 30 https://qwnkqpaloygtgvvwtalu.supabase.co/functions/v1/board/health
