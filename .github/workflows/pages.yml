# Publishes the dashboard (public/) to GitHub Pages on every change, free.
# It talks to the board API in public/config.js; sign in with the owner token.
name: Publish Company Floor

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the build so open dashboards can offer a one-tap update
        run: |
          v="${GITHUB_SHA::12}"
          printf '{"version":"%s"}\n' "$v" > public/version.json
          sed -i -E "s#(src|href)=\"(style\.css|config\.js|confetti\.js|office\.js|sprite-maker\.js|app\.js)\"#\1=\"\2?v=$v\"#g; s#<meta name=\"build\" content=\"[^\"]*\">#<meta name=\"build\" content=\"$v\">#" public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
